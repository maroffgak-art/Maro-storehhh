<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARO | المتجر الرقمي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --canvas: #000000;
            --surface: #0A0A0A;
            --ink: #EDEDED;
            --muted: #A1A1A1;
            --border: #1A1A1A;
            --action: #006EFE;
        }
        body { font-family: 'Cairo', sans-serif; background-color: var(--canvas); color: var(--ink); }
        .product-card { transition: transform 0.2s ease, border-color 0.2s ease; }
        .product-card:hover { transform: translateY(-4px); border-color: #333; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-black/80 backdrop-blur-md border-b border-[#1A1A1A]">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-white rounded-lg flex items-center justify-center text-black font-black text-lg">M</div>
                <span class="text-lg font-bold tracking-tight">MARO<span class="text-gray-500">.</span></span>
            </div>
            <div class="flex items-center gap-6">
                <a href="admin.html" class="text-sm font-medium text-gray-400 hover:text-white transition">لوحة التحكم</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-6xl mx-auto px-6 py-16 w-full">
        <!-- Hero -->
        <div class="text-center mb-16">
            <h1 class="text-4xl md:text-5xl font-black tracking-tight mb-4">متجرك الرقمي.</h1>
            <p class="text-gray-400 text-lg">منتجات مختارة بعناية، بأسعار واضحة.</p>
        </div>

        <!-- Products Grid -->
        <div id="store-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- سيتم تعبئتها عبر JS -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-[#1A1A1A] py-8 text-center text-gray-600 text-xs">
        <p>© 2026 MARO Store. جميع الحقوق محفوظة.</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAZucoNuZyKDoxfS7tboc3-ZttqONuw_vw",
            authDomain: "maro-store-4dc09.firebaseapp.com",
            projectId: "maro-store-4dc09",
            storageBucket: "maro-store-4dc09.firebasestorage.app",
            messagingSenderId: "55163169834",
            appId: "1:55163169834:web:48ba5eda57e23c41886753"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadStore() {
            const snap = await getDocs(collection(db, "products"));
            const grid = document.getElementById('store-grid');
            grid.innerHTML = '';
            
            if (snap.empty) {
                grid.innerHTML = '<div class="col-span-full text-center text-gray-600 py-20">لا توجد منتجات متاحة.</div>';
                return;
            }

            snap.forEach(doc => {
                const p = doc.data();
                grid.innerHTML += `
                    <div class="product-card bg-[#0A0A0A] border border-[#1A1A1A] rounded-xl overflow-hidden group flex flex-col">
                        <div class="h-48 bg-[#111] overflow-hidden relative border-b border-[#1A1A1A]">
                            ${p.image ? `<img src="${p.image}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center text-gray-700"><svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg></div>`}
                        </div>
                        <div class="p-5 flex flex-col flex-1">
                            <h3 class="font-bold text-white mb-1">${p.name}</h3>
                            <p class="text-gray-500 text-sm mb-4 line-clamp-2 flex-1">${p.description || ''}</p>
                            <div class="flex items-center justify-between pt-4 border-t border-[#1A1A1A] mt-auto">
                                <span class="text-xl font-mono font-bold text-white">$${p.price}</span>
                                <button class="bg-white hover:bg-gray-200 text-black text-xs font-bold py-1.5 px-4 rounded-lg transition">شراء</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        loadStore();
    </script>
</body>
</html>
