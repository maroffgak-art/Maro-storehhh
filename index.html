<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARO Control | لوحة التحكم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Tajawal', 'sans-serif'] },
                    colors: { brand: { 500: '#6d5dfc', 600: '#5b4ee3' }, sidebar: '#1a1b2f' }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8fafc; }
        .sidebar-item.active { background: rgba(255,255,255,0.1); border-right: 3px solid #6d5dfc; color: white; }
        .sidebar-item:hover { background: rgba(255,255,255,0.05); color: white; }
    </style>
</head>
<body class="h-screen overflow-hidden flex text-dark">

    <!-- Login Overlay -->
    <div id="login-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-50">
        <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md border border-gray-100">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-brand-500 rounded-2xl flex items-center justify-center text-white text-3xl mx-auto mb-4"><i class="ph-fill ph-chart-pie-slice"></i></div>
                <h1 class="text-2xl font-black">MARO Control</h1>
                <p class="text-gray-500 text-sm mt-1">تسجيل دخول الإدارة</p>
            </div>
            <input type="email" id="email" placeholder="البريد الإلكتروني" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 mb-4 focus:outline-none focus:border-brand-500">
            <input type="password" id="password" placeholder="كلمة المرور" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 mb-6 focus:outline-none focus:border-brand-500">
            <button onclick="window.login()" class="w-full bg-brand-500 text-white font-bold py-3 rounded-xl hover:bg-brand-600 transition">دخول</button>
            <p id="login-error" class="text-red-500 text-sm mt-4 text-center hidden"></p>
        </div>
    </div>

    <!-- Sidebar -->
    <aside class="w-64 bg-sidebar flex-shrink-0 flex flex-col hidden md:flex z-20">
        <div class="h-20 flex items-center gap-3 px-6 border-b border-white/5">
            <div class="w-10 h-10 bg-brand-500 rounded-xl flex items-center justify-center text-white"><i class="ph-fill ph-chart-pie-slice"></i></div>
            <div><h1 class="text-lg font-black text-white">MARO</h1></div>
        </div>
        <nav class="flex-1 px-3 py-6 space-y-1">
            <a href="#" class="sidebar-item active flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 transition">
                <i class="ph ph-squares-four text-xl"></i> <span class="font-bold text-sm">المنتجات</span>
            </a>
        </nav>
        <div class="p-4 border-t border-white/5 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-full bg-brand-500 flex items-center justify-center text-white text-xs font-bold">م</div>
                <span class="text-white text-sm font-bold">مارو</span>
            </div>
            <button onclick="window.logout()" class="text-gray-400 hover:text-white"><i class="ph ph-sign-out text-xl"></i></button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full overflow-hidden">
        <header class="h-20 bg-white border-b flex items-center justify-between px-8">
            <h2 class="text-xl font-black">إدارة المنتجات</h2>
            <button onclick="window.openModal()" class="bg-brand-500 text-white font-bold py-2 px-6 rounded-xl hover:bg-brand-600 transition flex items-center gap-2">
                <i class="ph ph-plus"></i> إضافة منتج
            </button>
        </header>

        <div class="flex-1 overflow-y-auto p-8">
            <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
                <table class="w-full text-right">
                    <thead class="bg-gray-50 text-gray-500 text-sm">
                        <tr>
                            <th class="p-4 font-bold">المنتج</th>
                            <th class="p-4 font-bold">السعر</th>
                            <th class="p-4 font-bold">القسم</th>
                            <th class="p-4 font-bold">إجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-gray-100">
                        <!-- JS Populated -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Product Modal -->
    <div id="product-modal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-3xl p-6 shadow-2xl">
            <h3 id="modal-title" class="text-xl font-black mb-4">إضافة منتج</h3>
            <input type="hidden" id="prod-id">
            <div class="space-y-4">
                <input type="text" id="prod-name" placeholder="اسم المنتج" class="w-full bg-gray-50 border rounded-xl p-3">
                <input type="number" id="prod-price" placeholder="السعر" class="w-full bg-gray-50 border rounded-xl p-3">
                <select id="prod-cat" class="w-full bg-gray-50 border rounded-xl p-3">
                    <option value="games">ألعاب</option>
                    <option value="subscriptions">اشتراكات</option>
                </select>
                <textarea id="prod-desc" placeholder="الوصف" class="w-full bg-gray-50 border rounded-xl p-3"></textarea>
                <input type="file" id="prod-img" accept="image/*" class="w-full text-sm">
            </div>
            <div class="flex justify-end gap-2 mt-6">
                <button onclick="window.closeModal()" class="px-4 py-2 text-gray-500 font-bold hover:bg-gray-100 rounded-lg">إلغاء</button>
                <button onclick="window.saveProduct()" class="px-4 py-2 bg-brand-500 text-white font-bold rounded-lg hover:bg-brand-600">حفظ</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, addDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAZucoNuZyKDoxfS7tboc3-ZttqONuw_vw",
            authDomain: "maro-store-4dc09.firebaseapp.com",
            projectId: "maro-store-4dc09",
            storageBucket: "maro-store-4dc09.firebasestorage.app",
            messagingSenderId: "55163169834",
            appId: "1:55163169834:web:48ba5eda57e23c41886753"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let products = [];
        let base64Img = "";

        window.login = () => {
            signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value)
                .catch(() => document.getElementById('login-error').classList.remove('hidden'));
        };

        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, user => {
            if (user) {
                document.getElementById('login-overlay').classList.add('hidden');
                loadProducts();
            } else {
                document.getElementById('login-overlay').classList.remove('hidden');
            }
        });

        async function loadProducts() {
            const snap = await getDocs(collection(db, "products"));
            products = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('table-body');
            if (products.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-500">لا يوجد منتجات.</td></tr>';
                return;
            }
            tbody.innerHTML = products.map(p => `
                <tr class="hover:bg-gray-50">
                    <td class="p-4 flex items-center gap-3">
                        <div class="w-10 h-10 bg-gray-100 rounded-lg overflow-hidden border">
                            ${p.image ? `<img src="${p.image}" class="w-full h-full object-cover">` : ''}
                        </div>
                        <span class="font-bold">${p.name}</span>
                    </td>
                    <td class="p-4 text-brand-600 font-black">$${p.price}</td>
                    <td class="p-4 text-gray-500">${p.categoryId === 'games' ? 'ألعاب' : 'اشتراكات'}</td>
                    <td class="p-4 flex gap-2">
                        <button onclick="window.editProduct('${p.id}')" class="text-blue-500 bg-blue-50 p-2 rounded-lg"><i class="ph ph-pencil-simple"></i></button>
                        <button onclick="window.deleteProduct('${p.id}')" class="text-red-500 bg-red-50 p-2 rounded-lg"><i class="ph ph-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        window.openModal = (id = null) => {
            document.getElementById('product-modal').classList.remove('hidden');
            document.getElementById('product-modal').classList.add('flex');
            if (id) {
                const p = products.find(x => x.id === id);
                document.getElementById('modal-title').innerText = 'تعديل منتج';
                document.getElementById('prod-id').value = p.id;
                document.getElementById('prod-name').value = p.name;
                document.getElementById('prod-price').value = p.price;
                document.getElementById('prod-cat').value = p.categoryId;
                document.getElementById('prod-desc').value = p.description || '';
                base64Img = p.image || '';
            } else {
                document.getElementById('modal-title').innerText = 'إضافة منتج';
                document.getElementById('prod-id').value = '';
                document.getElementById('prod-name').value = '';
                document.getElementById('prod-price').value = '';
                document.getElementById('prod-desc').value = '';
                base64Img = '';
            }
        };

        window.closeModal = () => {
            document.getElementById('product-modal').classList.add('hidden');
            document.getElementById('product-modal').classList.remove('flex');
        };

        document.getElementById('prod-img').addEventListener('change', e => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => base64Img = ev.target.result;
            reader.readAsDataURL(file);
        });

        window.saveProduct = async () => {
            const id = document.getElementById('prod-id').value;
            const data = {
                name: document.getElementById('prod-name').value,
                price: parseFloat(document.getElementById('prod-price').value),
                categoryId: document.getElementById('prod-cat').value,
                description: document.getElementById('prod-desc').value,
                image: base64Img,
                createdAt: Date.now()
            };
            if (!data.name || isNaN(data.price)) return alert("أكمل البيانات");

            if (id) await updateDoc(doc(db, "products", id), data);
            else await addDoc(collection(db, "products"), data);

            window.closeModal();
            loadProducts();
        };

        window.editProduct = (id) => window.openModal(id);

        window.deleteProduct = async (id) => {
            if (confirm("تأكيد الحذف؟")) {
                await deleteDoc(doc(db, "products", id));
                loadProducts();
            }
        };
    </script>
</body>
</html>
