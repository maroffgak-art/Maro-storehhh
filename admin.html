<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARO | لوحة التحكم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --canvas: #000000;
            --surface: #0A0A0A;
            --ink: #EDEDED;
            --muted: #A1A1A1;
            --border: #1A1A1A;
            --action: #006EFE;
        }
        body { font-family: 'Cairo', sans-serif; background-color: var(--canvas); color: var(--ink); }
        .glass-panel { background-color: var(--surface); border: 1px solid var(--border); }
        .nav-item.active { background-color: rgba(255,255,255,0.03); border-right: 2px solid var(--action); color: var(--ink); }
        .nav-item:hover { background-color: rgba(255,255,255,0.02); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--canvas); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        .table-row:hover { background-color: rgba(255,255,255,0.02); }
    </style>
</head>
<body class="antialiased h-screen overflow-hidden">

    <!-- شاشة التحميل -->
    <div id="global-loader" class="fixed inset-0 z-[100] bg-black flex items-center justify-center">
        <div class="w-8 h-8 border-2 border-gray-600 border-t-white rounded-full animate-spin"></div>
    </div>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black p-4">
        <div class="glass-panel p-8 rounded-xl w-full max-w-sm">
            <div class="text-center mb-8">
                <div class="w-12 h-12 bg-white rounded-lg flex items-center justify-center text-black font-black text-2xl mx-auto mb-4">M</div>
                <h1 class="text-xl font-bold">تسجيل الدخول</h1>
                <p class="text-sm text-gray-500 mt-1">أدخل بيانات حساب الأدمن</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-1">البريد الإلكتروني</label>
                    <input type="email" id="email" class="w-full bg-[#0A0A0A] border border-[#1A1A1A] rounded-lg px-4 py-2.5 text-white text-sm focus:outline-none focus:border-[#006EFE] transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-1">كلمة المرور</label>
                    <input type="password" id="password" class="w-full bg-[#0A0A0A] border border-[#1A1A1A] rounded-lg px-4 py-2.5 text-white text-sm focus:outline-none focus:border-[#006EFE] transition">
                </div>
                <button onclick="handleLogin()" class="w-full bg-white hover:bg-gray-200 text-black font-bold py-2.5 rounded-lg transition text-sm">دخول</button>
                <p id="login-error" class="text-red-500 text-xs text-center hidden"></p>
            </div>
        </div>
    </div>

    <!-- محتوى لوحة التحكم -->
    <div id="admin-content" class="hidden flex h-full">
        <!-- Sidebar -->
        <aside class="w-64 glass-panel flex flex-col border-l-0 border-r border-[#1A1A1A]">
            <div class="h-16 flex items-center px-6 border-b border-[#1A1A1A]">
                <span class="text-lg font-bold tracking-tight">MARO<span class="text-gray-500">.</span></span>
            </div>
            <nav class="flex-1 py-4 space-y-1">
                <button onclick="switchTab('overview')" id="btn-overview" class="nav-item active w-full flex items-center gap-3 px-6 py-2.5 text-sm font-medium text-gray-400 transition-all">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                    نظرة عامة
                </button>
                <button onclick="switchTab('products')" id="btn-products" class="nav-item w-full flex items-center gap-3 px-6 py-2.5 text-sm font-medium text-gray-400 transition-all">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                    المنتجات
                </button>
                <button onclick="logout()" class="nav-item w-full flex items-center gap-3 px-6 py-2.5 text-sm font-medium text-red-500 hover:bg-red-500/10 transition-all mt-auto">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    تسجيل الخروج
                </button>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto bg-black p-8">
            <!-- Header -->
            <header class="flex items-center justify-between mb-8">
                <h2 id="page-title" class="text-2xl font-bold tracking-tight">نظرة عامة</h2>
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-[#006EFE] flex items-center justify-center text-white text-xs font-bold">AD</div>
                </div>
            </header>

            <!-- Overview Tab -->
            <div id="tab-overview" class="space-y-6">
                <!-- Stats -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="glass-panel p-5 rounded-xl">
                        <p class="text-xs font-medium text-gray-500 mb-1">إجمالي المبيعات</p>
                        <h3 class="text-3xl font-bold tracking-tight">$<span id="stat-sales">0</span></h3>
                    </div>
                    <div class="glass-panel p-5 rounded-xl">
                        <p class="text-xs font-medium text-gray-500 mb-1">عدد المنتجات</p>
                        <h3 class="text-3xl font-bold tracking-tight"><span id="stat-products">0</span></h3>
                    </div>
                    <div class="glass-panel p-5 rounded-xl">
                        <p class="text-xs font-medium text-gray-500 mb-1">الأقسام النشطة</p>
                        <h3 class="text-3xl font-bold tracking-tight"><span id="stat-categories">0</span></h3>
                    </div>
                </div>
                <!-- Charts -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                    <div class="glass-panel p-5 rounded-xl">
                        <h3 class="text-sm font-bold mb-4">المبيعات</h3>
                        <div class="h-64"><canvas id="salesChart"></canvas></div>
                    </div>
                    <div class="glass-panel p-5 rounded-xl">
                        <h3 class="text-sm font-bold mb-4">توزيع المنتجات</h3>
                        <div class="h-64"><canvas id="categoryChart"></canvas></div>
                    </div>
                </div>
            </div>

            <!-- Products Tab -->
            <div id="tab-products" class="hidden">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold">المنتجات</h2>
                    <button onclick="openModal()" class="bg-white hover:bg-gray-200 text-black text-sm font-bold py-2 px-4 rounded-lg transition">إضافة منتج</button>
                </div>
                <div class="glass-panel rounded-xl overflow-hidden">
                    <table class="w-full text-right text-sm">
                        <thead class="bg-[#0A0A0A] border-b border-[#1A1A1A] text-gray-400">
                            <tr>
                                <th class="p-4 font-medium">المنتج</th>
                                <th class="p-4 font-medium">القسم</th>
                                <th class="p-4 font-medium">السعر</th>
                                <th class="p-4 font-medium">إجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="products-table-body" class="divide-y divide-[#1A1A1A]"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div id="product-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 backdrop-blur-sm p-4">
        <div class="glass-panel w-full max-w-md p-6 rounded-xl">
            <h3 id="modal-title" class="text-lg font-bold mb-4">إضافة منتج</h3>
            <input type="hidden" id="prod-id">
            <div class="space-y-4">
                <input type="text" id="prod-name" placeholder="اسم المنتج" class="w-full bg-black border border-[#1A1A1A] rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#006EFE]">
                <div class="grid grid-cols-2 gap-4">
                    <input type="number" id="prod-price" placeholder="السعر" class="w-full bg-black border border-[#1A1A1A] rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#006EFE]">
                    <select id="prod-category" class="w-full bg-black border border-[#1A1A1A] rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#006EFE]"></select>
                </div>
                <textarea id="prod-desc" rows="2" placeholder="الوصف" class="w-full bg-black border border-[#1A1A1A] rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#006EFE]"></textarea>
                <input type="file" id="prod-image" class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-bold file:bg-white file:text-black">
            </div>
            <div class="flex justify-end gap-3 mt-6">
                <button onclick="closeModal()" class="text-sm text-gray-400 hover:text-white transition">إلغاء</button>
                <button onclick="saveProduct()" class="bg-white text-black text-sm font-bold px-6 py-2 rounded-lg transition">حفظ</button>
            </div>
        </div>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
